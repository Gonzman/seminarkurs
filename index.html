<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body class="background">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <style>
    .background {
      position: relative;
      overflow: hidden;
    }

    .background::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 255, 0, 0.03) 2px,
          rgba(0, 255, 0, 0.03) 4px
        ),
        #0a0f0a;
      filter: brightness(1);
      animation:
        lightPulse 5s ease-in-out infinite,
        flicker 3s steps(2, end) infinite;
      z-index: -1;
    }

    @keyframes lightPulse {
      0%,
      100% {
        filter: brightness(1);
      }
      50% {
        filter: brightness(1.2);
      }
    }

    @keyframes flicker {
      0%,
      100% {
        opacity: 0.9;
      }
      10% {
        opacity: 0.4;
      }
      20% {
        opacity: 1;
      }
      30% {
        opacity: 0.7;
      }
      50% {
        opacity: 0.85;
      }
      70% {
        opacity: 0.5;
      }
      90% {
        opacity: 1;
      }
    }
  </style>
</html>
